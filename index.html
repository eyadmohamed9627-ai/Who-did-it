<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقيقات إياد الجنائية</title>
    <style>
        :root { --gold: #ffd700; --red: #ff4757; --bg: #050505; --card: #111; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--gold); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-gold { background: linear-gradient(135deg, var(--gold), #b8860b); color: black; }
        .btn-danger { background: var(--red); color: white; }
        .btn-dark { background: #333; color: white; }
        .hidden { display: none; }
        .score-board { background: #1a1a1a; padding: 10px; border-radius: 10px; border: 1px solid var(--gold); text-align: center; margin-bottom: 15px; color: var(--gold); }
        .case-box { background: rgba(255, 71, 87, 0.1); padding: 15px; border-radius: 15px; border: 1px solid var(--red); margin-bottom: 15px; }
        .q-box { background: #161616; padding: 25px; border-radius: 15px; border-right: 5px solid var(--gold); text-align: center; min-height: 120px; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1.6; }
        .alibi { color: #00ffcc; margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div id="scoreArea" class="score-board">🏆 النقاط: <span id="scores">أضف لاعبين</span></div>

    <div id="setup">
        <h1>🕵️‍♂️ جنايات إياد</h1>
        <input type="text" id="pInput" placeholder="اكتب اسم اللاعب...">
        <button class="btn-gold" onclick="addP()">➕ إضافة لاعب</button>
        <div id="pList" style="text-align:center; margin:10px;"></div>
        <button class="btn-dark" style="background:white; color:black;" onclick="startGame()">🚀 ابدأ اللعبة</button>
    </div>

    <div id="roleScreen" class="hidden">
        <h2 id="turnName" style="text-align:center;"></h2>
        <div class="q-box">
            <div>
                <p id="roleText" style="font-weight:bold; font-size:24px;">****</p>
                <p id="alibiText" class="alibi"></p>
            </div>
        </div>
        <button class="btn-gold" onmousedown="reveal(true)" onmouseup="reveal(false)" ontouchstart="reveal(true)" ontouchend="reveal(false)">اضغط مطولاً لكشف هويتك 👁️</button>
        <button class="btn-dark" onclick="nextPlayer()">التالي ➡️</button>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="case-box">
            <h3 style="margin:0; color:var(--red);">⚠️ القضية الحالية</h3>
            <p id="caseDesc" style="margin:10px 0; font-size:15px;"></p>
        </div>
        <div id="qSection">
            <p id="qCount" style="color:var(--gold); font-weight:bold;">السؤال 1 من 10</p>
            <div class="q-box" id="qText"></div>
            <button class="btn-gold" id="nextQBtn" onclick="nextQuestion()">السؤال التالي ➡️</button>
            <button class="btn-gold hidden" id="freeQBtn" style="background:#00ffcc; color:black;" onclick="alert('اسألوا بعض اللي انتوا عايزينه!')">🎤 أسئلة حرة</button>
        </div>
        <button class="btn-danger" onclick="startVoting()">🚨 تصويت سري</button>
    </div>

    <div id="passScreen" class="hidden" style="text-align:center;">
        <h2 style="margin-top:50px;">سلم الموبايل لـ:</h2>
        <p id="voterName" style="font-size:35px; color:var(--gold); font-weight:bold;"></p>
        <button class="btn-gold" onclick="goToVote()">أنا استلمت ✅</button>
    </div>

    <div id="voteScreen" class="hidden">
        <h2 style="text-align:center;">🗳️ صوت في سرك</h2>
        <select id="voteSelect" style="width:100%; padding:15px; border-radius:10px; background:#222; color:white; border:1px solid var(--gold);"></select>
        <button class="btn-danger" style="margin-top:20px;" onclick="submitVote()">تأكيد الصوت 🔒</button>
    </div>

    <div id="resultScreen" class="hidden">
        <h2 id="finalMsg" style="text-align:center; color:var(--gold);"></h2>
        <div style="background:#1a1a1a; padding:20px; border-radius:15px; border:1px solid var(--red); margin-top:20px;">
            <h3 style="text-align:center; color:var(--red); margin:0;">⚖️ جلسة العقاب</h3>
            <p id="loserText" style="text-align:center; font-weight:bold; font-size:18px; margin:15px 0;"></p>
            <button class="btn-gold" style="background:#00ffcc; color:black;" onclick="getAIControl()">حكم AI عشوائي 🤖</button>
            <div id="punishBox" class="hidden" style="margin-top:15px; border:1px dashed var(--gold); padding:10px; text-align:center; color:var(--gold);"></div>
        </div>
        <button class="btn-gold" style="margin-top:20px;" onclick="startGame()">جيم جديد بجريمة جديدة 🔁</button>
    </div>
</div>

<script>
    let players = [], points = {}, roles = {}, alibis = {}, idx = 0, qIdx = 0, votes = {};
    const crimeList = [
        "قتل حارس الفيلا بآلة حادة واختفاء المجوهرات من الخزنة.",
        "خطف سيدة أعمال والمطالبة بفدية 5 مليون جنيه كاش.",
        "تزوير توقيع مدير البنك وسحب مبالغ ضخمة من الحسابات.",
        "سرقة لوحة نادرة من المعرض الفني واستبدالها بنسخة مزيفة.",
        "تسميم العصير في حفلة تخرج مما أدى لنقل 10 أشخاص للمستشفى."
    ];
    const alibiList = ["كنت نايم في البيت.", "كنت بشتري طلبات من السوبر ماركت.", "كنت عند الحلاق.", "كنت بذاكر مع صحابي.", "كنت في المواصلات وقتها."];
    const questionList = [
        "أوصف لي حاجة واحدة كانت على يمينك وقت الجريمة؟",
        "تفتكر مين أكتر واحد شاكك فيك دلوقتي؟ واجهه!",
        "لو فتشت تليفونك، هلاقي رسالة لمين الساعة 9؟",
        "لو تضحي بواحد عشان تنجو، هتختار مين؟",
        "ليه ملامحك اتغيرت أول ما بدأنا نوصف الجريمة؟",
        "لو سألتك عن لون الباب اللي خرجت منه، هتقول إيه؟",
        "أوصف لي شعورك أول ما عرفت إن فيه ضحية؟",
        "في تفصيلة مريبة في لبسك بتأكد إنك كنت موجود.. بررها!",
        "معاك 10 ثواني تدافع عن نفسك.. ابدأ!",
        "لو كنت أنت المجرم، كنت هتهرب إزاي؟"
    ];

    function addP() {
        let n = document.getElementById('pInput').value.trim();
        if(n && !players.includes(n)) {
            players.push(n); points[n] = 0;
            document.getElementById('pInput').value = '';
            document.getElementById('pList').innerHTML += `<span style="background:#333; padding:5px 12px; border-radius:20px; margin:5px; display:inline-block; border:1px solid #555;">${n}</span>`;
            updateScores();
        }
    }

    function updateScores() {
        document.getElementById('scores').innerText = Object.entries(points).map(([n, p]) => `${n}: ${p}`).join(" | ");
    }

    function startGame() {
        if(players.length < 3) return alert("محتاجين 3 لاعبين على الأقل!");
        idx = 0; qIdx = 0; votes = {};
        let imp = players[Math.floor(Math.random() * players.length)];
        players.forEach(p => {
            roles[p] = (p === imp ? "أنت المجرم 😈" : "أنت بريء 🔍");
            alibis[p] = alibiList[Math.floor(Math.random() * alibiList.length)];
        });
        document.getElementById('caseDesc').innerText = crimeList[Math.floor(Math.random() * crimeList.length)];
        showSection('roleScreen');
        updateRoleUI();
    }

    function reveal(show) {
        let p = players[idx];
        document.getElementById('roleText').innerText = show ? roles[p] : "****";
        if(show) {
            document.getElementById('alibiText').innerText = roles[p].includes("بريء") ? "حجتك: " + alibis[p] : "ألف حجة كدابة بسرعة!";
        } else {
            document.getElementById('alibiText').innerText = "";
        }
    }

    function nextPlayer() {
        if(idx < players.length - 1) { idx++; updateRoleUI(); reveal(false); }
        else { showSection('gameScreen'); showQuestion(); }
    }

    function updateRoleUI() { document.getElementById('turnName').innerText = "الدور على: " + players[idx]; }

    function showQuestion() {
        if(qIdx < 10) {
            document.getElementById('qCount').innerText = `السؤال ${qIdx + 1} من 10`;
            document.getElementById('qText').innerText = questionList[qIdx];
        } else {
            document.getElementById('nextQBtn').classList.add('hidden');
            document.getElementById('freeQBtn').classList.remove('hidden');
            document.getElementById('qText').innerText = "انتهت الأسئلة.. المواجهة الحرة بدأت!";
        }
    }

    function nextQuestion() { qIdx++; showQuestion(); }

    function startVoting() { idx = 0; showPass(); }
    function showPass() { showSection('passScreen'); document.getElementById('voterName').innerText = players[idx]; }
    function goToVote() {
        showSection('voteScreen');
        let s = document.getElementById('voteSelect'); s.innerHTML = "";
        players.forEach(p => { if(p !== players[idx]) s.innerHTML += `<option value="${p}">${p}</option>`; });
    }

    function submitVote() {
        let v = document.getElementById('voteSelect').value;
        votes[v] = (votes[v] || 0) + 1;
        if(++idx < players.length) showPass();
        else revealFinal();
    }

    function revealFinal() {
        showSection('resultScreen');
        let kicked = Object.keys(votes).reduce((a, b) => votes[a] > votes[b] ? a : b);
        let isImp = roles[kicked].includes("😈");
        if(isImp) {
            document.getElementById('finalMsg').innerText = `✅ عفارم عليكم! المجرم كان ${kicked}`;
            players.forEach(p => { if(!roles[p].includes("😈")) points[p] += 10; });
        } else {
            document.getElementById('finalMsg').innerText = `❌ للأسف.. ${kicked} بريء والمجرم هرب!`;
            let imp = players.find(p => roles[p].includes("😈")); points[imp] += 20;
        }
        updateScores();
        let loser = Object.keys(points).reduce((a, b) => points[a] < points[b] ? a : b);
        document.getElementById('loserText').innerText = "المحكوم عليه (أقل نقاط): " + loser;
        document.getElementById('punishBox').classList.add('hidden');
    }

    function getAIControl() {
        const pList = ["اشرب مية بملح", "20 ضغط", "غني بصوت عالي", "كل ليمونة بقشرها", "كلم حد وقوله نكتة بايخة"];
        document.getElementById('punishBox').innerText = "🔥 الحكم: " + pList[Math.floor(Math.random()*pList.length)];
        document.getElementById('punishBox').classList.remove('hidden');
    }

    function showSection(id) {
        document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        document.getElementById('scoreArea').classList.remove('hidden');
    }
</script>
</body>
</html>
